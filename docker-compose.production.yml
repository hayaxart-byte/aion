services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medplum
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medplum_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum -d medplum"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  medplum:
    image: medplum/medplum-server:5.1.17
    ports:
      - "8103:8103"
    environment:
      NODE_ENV: production
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: http://medplum:8103
      MEDPLUM_DATABASE_HOST: postgres
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: medplum
      MEDPLUM_DATABASE_USERNAME: medplum
      MEDPLUM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-medplum_dev}
      MEDPLUM_DATABASE_SSL_REQUIRE: "false"
      MEDPLUM_DATABASE_RUN_MIGRATIONS: "true"
      MEDPLUM_REDIS_HOST: redis
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_EMAIL_PROVIDER: none
      MEDPLUM_REGISTER_ENABLED: "true"
      MEDPLUM_LOG_LEVEL: info
    volumes:
      - ./medplum.config.json:/usr/src/medplum/medplum.config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8103/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  pgdata:
